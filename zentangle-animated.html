<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zentangle Paradox — Animated</title>
<style>
  * { margin: 0; padding: 0; }
  body { background: #f5f0e8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const BG_COLOR = '#f5f0e8';
const STEPS = 50;
const ADVANCE = 0.075;
const CYCLE_SECONDS = 10;

let W = 0;

function resize() {
  W = Math.min(innerWidth, innerHeight) * 0.92;
  const dpr = devicePixelRatio;
  canvas.width = W * dpr;
  canvas.height = W * dpr;
  canvas.style.width = W + 'px';
  canvas.style.height = W + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function lerp(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
}

function rotatePoint(p, cx, cy, cos, sin) {
  const dx = p[0] - cx, dy = p[1] - cy;
  return [cx + dx * cos - dy * sin, cy + dx * sin + dy * cos];
}

/**
 * Zentangle Paradox with animated inner rotation.
 *
 * The outer triangle is drawn fixed. Each recursive contraction step
 * applies the standard affine map (advance each vertex along its edge)
 * PLUS an additional rotation `delta` around the new triangle's centroid.
 *
 * This means the n-th inner triangle accumulates n*delta extra rotation
 * beyond the natural spiral rotation. The result: the spiral appears
 * to wind/unwind while the tessellation boundary stays locked in place.
 */
function drawParadox(A, B, C, steps, frac, reverse, delta) {
  let p = A, q = B, r = C;
  const cosDelta = Math.cos(delta);
  const sinDelta = Math.sin(delta);

  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    ctx.lineWidth = Math.max(0.15, 0.25 + 0.85 * (1 - t));
    ctx.strokeStyle = `rgba(15,15,15,${0.3 + 0.6 * (1 - t * 0.4)})`;

    ctx.beginPath();
    ctx.moveTo(p[0], p[1]);
    ctx.lineTo(q[0], q[1]);
    ctx.lineTo(r[0], r[1]);
    ctx.closePath();
    ctx.stroke();

    // Standard affine contraction
    let np, nq, nr;
    if (!reverse) {
      np = lerp(p, q, frac);
      nq = lerp(q, r, frac);
      nr = lerp(r, p, frac);
    } else {
      np = lerp(p, r, frac);
      nq = lerp(q, p, frac);
      nr = lerp(r, q, frac);
    }

    // Extra rotation around the contracted triangle's centroid
    const gcx = (np[0] + nq[0] + nr[0]) / 3;
    const gcy = (np[1] + nq[1] + nr[1]) / 3;
    np = rotatePoint(np, gcx, gcy, cosDelta, sinDelta);
    nq = rotatePoint(nq, gcx, gcy, cosDelta, sinDelta);
    nr = rotatePoint(nr, gcx, gcy, cosDelta, sinDelta);

    p = np; q = nq; r = nr;
  }
}

function buildTriangles(size) {
  const numAcross = 5;
  const triWidth = size / numAcross;
  const triHeight = triWidth * Math.sqrt(3) / 2;
  const rows = Math.ceil(size / triHeight) + 1;
  const offsetY = (size - rows * triHeight) / 2;
  const offsetX = -triWidth / 2;
  const triangles = [];

  for (let row = 0; row < rows; row++) {
    const y = offsetY + row * triHeight;
    for (let k = -1; k <= numAcross + 1; k++) {
      const x = offsetX + k * triWidth;
      triangles.push({
        A: [x, y + triHeight],
        B: [x + triWidth, y + triHeight],
        C: [x + triWidth / 2, y],
        reverse: (row + k) % 2 === 0
      });
      const dx = x + triWidth / 2;
      triangles.push({
        A: [dx, y],
        B: [dx + triWidth, y],
        C: [dx + triWidth / 2, y + triHeight],
        reverse: (row + k) % 2 !== 0
      });
    }
  }
  return triangles;
}

let triangles = [];

function animate(time) {
  const size = W;
  if (size === 0) { requestAnimationFrame(animate); return; }
  if (triangles.length === 0) triangles = buildTriangles(size);

  // Smooth ping-pong easing for the per-step rotation delta
  const t01 = (time / 1000 / CYCLE_SECONDS) % 1;
  const pingPong = t01 < 0.5 ? t01 * 2 : 2 - t01 * 2;
  const eased = 0.5 - 0.5 * Math.cos(pingPong * Math.PI);

  // Extra rotation per contraction step: oscillates ±5°
  // The natural rotation is ~4.3°/step, so this roughly doubles
  // or cancels it, making spirals wind and unwind
  const delta = (eased * 2 - 1) * (5 * Math.PI / 180);

  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, size, size);

  const cx = size / 2, cy = size / 2;
  const radius = size * 0.46;

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.clip();

  ctx.fillStyle = BG_COLOR;
  ctx.fillRect(0, 0, size, size);

  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  for (const tri of triangles) {
    drawParadox(tri.A, tri.B, tri.C, STEPS, ADVANCE, tri.reverse, delta);
  }

  ctx.restore();

  ctx.strokeStyle = '#1a1a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.stroke();

  requestAnimationFrame(animate);
}

resize();
addEventListener('resize', () => { resize(); triangles = buildTriangles(W); });
requestAnimationFrame(animate);
</script>
</body>
</html>
